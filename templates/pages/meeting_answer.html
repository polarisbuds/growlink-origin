{{define "meeting_answer.html"}}
<!DOCTYPE html>
{{template "html"}}
<head>{{template "head" dict "Title" "面談記入 - Growlink" "PageScript" "/static/js/pages/meeting_answer.js"}}</head>
<body class="bg-base-200 font-sans antialiased" x-data="meetingAnswerPage" x-cloak>
<script type="application/json" id="meeting-json">{{.MeetingJSON}}</script>
<div class="flex h-screen overflow-hidden">
  {{template "sidebar" .}}
  <div class="flex min-w-0 flex-1 min-h-0 flex-col">
    {{template "header" dict "Breadcrumb" "記入" "UserName" .UserName}}
    <main class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6 max-w-2xl">
      <div class="flex items-center justify-between gap-4">
        <div>
          <h1 class="font-display text-2xl font-semibold">面談記入</h1>
          <p class="mt-1 text-sm text-base-content/60">各質問への回答を入力し、下書き保存または提出できます</p>
        </div>
        <a href="/meeting" class="btn btn-ghost btn-sm shrink-0">戻る</a>
      </div>
      <div class="mt-6 space-y-4">
        <template x-for="(a, i) in answers" :key="a.id">
          <div class="rounded-3xl border border-base-300 bg-base-100 p-5 shadow-sm">
            <div class="flex items-start gap-2">
              <span class="badge badge-primary badge-outline shrink-0" x-text="'Q' + (a.topic?.displayNo || (i + 1))"></span>
              <div class="flex-1 min-w-0">
                <p class="font-medium leading-relaxed" x-text="a.topic?.question"></p>
                <p class="mt-1 text-sm text-base-content/60 whitespace-pre-wrap" x-show="a.topic?.description" x-text="a.topic?.description"></p>
              </div>
              <span x-show="a.topic?.isRequire" class="badge badge-error badge-outline badge-sm shrink-0">必須</span>
            </div>
            <textarea class="textarea textarea-bordered mt-3 w-full" rows="3" x-model="drafts[a.id]"></textarea>
          </div>
        </template>
      </div>
      <div class="mt-6 flex flex-wrap gap-2">
        <button type="button" class="btn btn-outline" @click="saveDraft()">下書き保存</button>
        <button type="button" class="btn btn-primary" @click="submit()">提出</button>
        <button type="button" class="btn btn-ghost" @click="cancelSubmit()">提出キャンセル</button>
      </div>
    </main>
  </div>
</div>
</body>
</html>
{{end}}
