{{define "meeting_new.html"}}
<!DOCTYPE html>
{{template "html"}}
<head>{{template "head" dict "Title" "1on1作成 - Growlink" "PageScript" "/static/js/pages/meeting_new.js"}}</head>
<body class="bg-base-200 font-sans antialiased" x-data="meetingNewPage" x-cloak>
<script type="application/json" id="pairings-json">{{.PairingsJSON}}</script>
<script type="application/json" id="templates-json">{{.TemplatesJSON}}</script>
<div class="flex h-screen overflow-hidden">
  {{template "sidebar" .}}
  <div class="flex min-w-0 flex-1 min-h-0 flex-col">
    {{template "header" dict "Breadcrumb" "1on1作成" "UserName" .UserName}}
    <main class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6 max-w-xl">
      <h1 class="font-display text-2xl font-semibold">1on1ミーティング作成</h1>
      <div class="mt-4 flex flex-wrap gap-2">
        <button type="button" class="btn btn-sm" :class="mode === 'single' ? 'btn-primary' : 'btn-outline'" @click="mode = 'single'">1件作成</button>
        <button type="button" class="btn btn-sm" :class="mode === 'all' ? 'btn-primary' : 'btn-outline'" @click="mode = 'all'">全ペア一括</button>
        <button type="button" class="btn btn-sm" :class="mode === 'monthly' ? 'btn-primary' : 'btn-outline'" @click="mode = 'monthly'">定期作成</button>
      </div>
      <div class="mt-6 rounded-3xl border border-base-300 bg-base-100 p-6 shadow-sm space-y-4">
        <p x-show="error" class="text-sm text-error" x-text="error"></p>
        <label x-show="mode === 'single'" class="form-control">
          <span class="label-text">ペア</span>
          <select class="select select-bordered" x-model.number="form.pairingId">
            <option value="0">選択してください</option>
            <template x-for="p in pairings" :key="p.id">
              <option :value="p.id" x-text="pairingLabel(p)"></option>
            </template>
          </select>
        </label>
        <label class="form-control">
          <span class="label-text">テンプレート</span>
          <select class="select select-bordered" x-model.number="form.templateId">
            <option value="0">選択してください</option>
            <template x-for="t in templates" :key="t.id">
              <option :value="t.id" x-text="t.title"></option>
            </template>
          </select>
        </label>
        <label x-show="mode !== 'monthly'" class="form-control">
          <span class="label-text">実施日</span>
          <input class="input input-bordered" type="date" x-model="form.implementedAt" />
        </label>
        <template x-if="mode === 'monthly'">
          <div class="space-y-4">
            <label class="form-control">
              <span class="label-text">基準月（その月の第N週を計算）</span>
              <input class="input input-bordered" type="month" x-model="form.baseMonth" />
            </label>
            <label class="form-control">
              <span class="label-text">第N週（1〜5）</span>
              <input class="input input-bordered" type="number" min="1" max="5" x-model.number="form.week" />
            </label>
            <label class="form-control">
              <span class="label-text">曜日</span>
              <select class="select select-bordered" x-model.number="form.weekday">
                <option value="0">日曜</option>
                <option value="1">月曜</option>
                <option value="2">火曜</option>
                <option value="3">水曜</option>
                <option value="4">木曜</option>
                <option value="5">金曜</option>
                <option value="6">土曜</option>
              </select>
            </label>
          </div>
        </template>
        <div class="flex flex-wrap gap-2 pt-2">
          <button type="button" class="btn btn-primary" :disabled="submitting" @click="submit()" x-text="submitLabel()"></button>
          <a href="/meeting/all" class="btn btn-ghost">戻る</a>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
{{end}}
