{{define "meeting_setting.html"}}
<!DOCTYPE html>
{{template "html"}}
<head>{{template "head" dict "Title" "ミーティング設定 - Growlink" "PageScript" "/static/js/pages/meeting_setting.js"}}</head>
<body class="bg-base-200 font-sans antialiased" x-data="meetingSettingPage" x-cloak>
<script type="application/json" id="meeting-json">{{.MeetingJSON}}</script>
<div class="flex h-screen overflow-hidden">
  {{template "sidebar" .}}
  <div class="flex min-w-0 flex-1 min-h-0 flex-col">
    {{template "header" dict "Breadcrumb" "ミーティング設定" "UserName" .UserName}}
    <main class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6 max-w-lg">
      <h1 class="font-display text-2xl font-semibold">実施予定日</h1>
      <div class="mt-6 rounded-3xl border border-base-300 bg-base-100 p-6 shadow-sm">
        <label class="form-control"><span class="label-text">実施予定日</span><input type="date" class="input input-bordered" x-model="date" /></label>
        <button type="button" class="btn btn-primary mt-6" @click="save()">保存</button>
        <a href="/meeting" class="btn btn-ghost mt-2">戻る</a>
      </div>
    </main>
  </div>
</div>
</body>
</html>
{{end}}
