{{define "meeting_all.html"}}
<!DOCTYPE html>
{{template "html"}}
<head>{{template "head" dict "Title" "全ての面談 - Growlink" "PageScript" "/static/js/pages/meeting_all.js"}}</head>
<body class="bg-base-200 font-sans antialiased" x-data="meetingAllPage" x-cloak>
<script type="application/json" id="meetings-json">{{.MeetingsJSON}}</script>
<div class="flex h-screen overflow-hidden">
  {{template "sidebar" .}}
  <div class="flex min-w-0 flex-1 min-h-0 flex-col">
    {{template "header" dict "Breadcrumb" "全ての面談" "UserName" .UserName}}
    <main class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h1 class="font-display text-2xl font-semibold">全ての面談</h1>
        <div class="flex flex-wrap items-center gap-2">
          <a href="/meeting/new" class="btn btn-sm btn-primary">1on1を追加</a>
          <a :href="simple ? '/meeting/all' : '/meeting/all?view=simple'" class="btn btn-sm btn-outline" x-text="simple ? '詳細表示' : '簡易表示'"></a>
        </div>
      </div>
      <div class="mt-6 overflow-hidden rounded-3xl border border-base-300 bg-base-100 shadow-sm">
        <table class="table">
          <thead><tr><th>メンター</th><th>メンティ</th><th>状態</th><th>実施日</th><th></th></tr></thead>
          <tbody>
            <template x-for="m in meetings" :key="m.uuid">
              <tr>
                <td x-text="m.pairing?.mentor?.name"></td>
                <td x-text="m.pairing?.mentee?.name"></td>
                <td><span class="badge" :class="statusBadge(m.status)" x-text="statusLabel(m.status)"></span></td>
                <td x-text="formatDate(m.implementedAt)"></td>
                <td><a :href="'/meeting/' + m.uuid" class="btn btn-xs btn-ghost">閲覧</a></td>
              </tr>
              <tr x-show="simple" class="bg-base-200/40">
                <td colspan="5" class="text-sm text-base-content/70" x-text="m.template?.title"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</body>
</html>
{{end}}
