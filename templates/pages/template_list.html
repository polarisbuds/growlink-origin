{{define "template_list.html"}}
<!DOCTYPE html>
{{template "html"}}
<head>{{template "head" dict "Title" "テンプレート - Growlink" "PageScript" "/static/js/pages/template_list.js"}}</head>
<body class="bg-base-200 font-sans antialiased" x-data="templateListPage" x-cloak>
<script type="application/json" id="templates-json">{{.TemplatesJSON}}</script>
<div class="flex h-screen overflow-hidden">
  {{template "sidebar" .}}
  <div class="flex min-w-0 flex-1 min-h-0 flex-col">
    {{template "header" dict "Breadcrumb" "テンプレート" "UserName" .UserName}}
    <main class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6">
      <div class="flex justify-between items-center flex-wrap gap-2">
        <h1 class="font-display text-2xl font-semibold">テンプレート一覧</h1>
        <a href="/template/new" class="btn btn-primary btn-sm">新規作成</a>
      </div>
      <div class="mt-6 space-y-2">
        <template x-for="t in templates" :key="t.id">
          <div class="flex flex-wrap items-center justify-between gap-2 rounded-2xl border border-base-300 bg-base-100 p-4 shadow-sm">
            <div>
              <span class="badge badge-ghost mr-2" x-text="'#' + t.displayNo"></span>
              <a :href="'/template/' + t.id" class="font-medium hover:text-primary" x-text="t.title"></a>
              <span x-show="t.isSample" class="badge badge-outline ml-2">サンプル</span>
            </div>
            <div class="flex gap-1">
              <button type="button" class="btn btn-xs btn-outline" @click="copy(t)">コピー</button>
              <button type="button" class="btn btn-xs btn-ghost" @click="moveUp(t)">↑</button>
              <button type="button" class="btn btn-xs btn-ghost" @click="moveDown(t)">↓</button>
            </div>
          </div>
        </template>
      </div>
    </main>
  </div>
</div>
</body>
</html>
{{end}}
