{{define "meeting_list.html"}}
<!DOCTYPE html>
{{template "html"}}
<head>{{template "head" dict "Title" "面談一覧 - Growlink" "PageScript" "/static/js/pages/meeting_list.js"}}</head>
<body class="bg-base-200 font-sans antialiased" x-data="meetingListPage" x-cloak>
<script type="application/json" id="meetings-json">{{.MeetingsJSON}}</script>
<div class="flex h-screen overflow-hidden">
  {{template "sidebar" .}}
  <div class="flex min-w-0 flex-1 min-h-0 flex-col">
    {{template "header" dict "Breadcrumb" "面談一覧" "UserName" .UserName}}
    <main class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6">
      <h1 class="font-display text-2xl font-semibold">面談一覧</h1>
      <div class="mt-6 overflow-hidden rounded-3xl border border-base-300 bg-base-100 shadow-sm">
        <table class="table">
          <thead><tr><th>テンプレート</th><th>メンター</th><th>メンティ</th><th>実施予定日</th><th>状態</th><th></th></tr></thead>
          <tbody>
            <template x-for="m in meetings" :key="m.uuid">
              <tr>
                <td x-text="m.template?.title"></td>
                <td x-text="m.pairing?.mentor?.name"></td>
                <td x-text="m.pairing?.mentee?.name"></td>
                <td x-text="formatDate(m.implementedAt)"></td>
                <td><span class="badge" :class="statusBadge(m.status)" x-text="statusLabel(m.status)"></span></td>
                <td class="space-x-1">
                  <a :href="'/meeting/' + m.uuid + '/answer'" class="btn btn-xs btn-outline">記入</a>
                  <a :href="'/meeting/' + m.uuid" class="btn btn-xs btn-ghost">閲覧</a>
                  <a :href="'/meeting/' + m.uuid + '/setting'" class="btn btn-xs btn-ghost">設定</a>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</body>
</html>
{{end}}
