{{define "pairing_list.html"}}
<!DOCTYPE html>
{{template "html"}}
<head>{{template "head" dict "Title" "ペア一覧 - Growlink" "PageScript" "/static/js/pages/pairing_list.js"}}</head>
<body class="bg-base-200 font-sans antialiased" x-data="pairingListPage" x-cloak>
<script type="application/json" id="pairings-json">{{.PairingsJSON}}</script>
<div class="flex h-screen overflow-hidden">
  {{template "sidebar" .}}
  <div class="flex min-w-0 flex-1 min-h-0 flex-col">
    {{template "header" dict "Breadcrumb" "ペア一覧" "UserName" .UserName}}
    <main class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6">
      <div class="flex justify-between items-center">
        <h1 class="font-display text-2xl font-semibold">ペア一覧</h1>
        <a href="/pairing/new" class="btn btn-primary btn-sm">+ 作成</a>
      </div>
      <div class="mt-6 overflow-hidden rounded-3xl border border-base-300 bg-base-100 shadow-sm">
        <table class="table">
          <thead><tr><th>メンター</th><th>メンティ</th><th>繰り返し</th><th></th></tr></thead>
          <tbody>
            <template x-for="p in pairings" :key="p.id">
              <tr>
                <td x-text="p.mentor?.name"></td>
                <td x-text="p.mentee?.name"></td>
                <td x-text="recurLabel(p)"></td>
                <td class="space-x-1">
                  <a :href="'/pairing/' + p.id + '/edit'" class="btn btn-xs btn-outline">編集</a>
                  <button type="button" class="btn btn-xs btn-error btn-outline" @click="askDelete(p)">削除</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <dialog class="modal" :class="{ 'modal-open': deleteOpen }">
        <div class="modal-box"><h3 class="font-bold">削除の確認</h3><p class="py-4 text-sm">このペアを削除しますか？</p>
          <div class="modal-action"><button class="btn btn-ghost" @click="deleteOpen=false">キャンセル</button><button class="btn btn-error" @click="confirmDelete()">削除確定</button></div>
        </div>
        <form method="dialog" class="modal-backdrop"><button @click="deleteOpen=false">close</button></form>
      </dialog>
    </main>
  </div>
</div>
</body>
</html>
{{end}}
