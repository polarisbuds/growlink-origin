{{define "progress.html"}}
<!DOCTYPE html>
{{template "html"}}
<head>{{template "head" dict "Title" "進捗 - Growlink" "PageScript" "/static/js/pages/progress.js"}}</head>
<body class="bg-base-200 font-sans antialiased" x-data="progressPage" x-cloak>
<div class="flex h-screen overflow-hidden">
  {{template "sidebar" .}}
  <div class="flex min-w-0 flex-1 min-h-0 flex-col">
    {{template "header" dict "Breadcrumb" .Breadcrumb "UserName" .UserName}}
    <main class="flex-1 min-h-0 overflow-y-auto p-4 md:p-8">
      <h1 class="font-display text-2xl font-semibold">進捗</h1>
      <p class="mt-1 text-sm text-base-content/60">面談ステータス別の件数</p>
      <div class="mt-8 grid gap-4 md:grid-cols-2 xl:grid-cols-4">
        <div class="rounded-3xl border border-base-300 bg-base-100 p-5 shadow-sm">
          <p class="text-sm text-base-content/60">未着手</p>
          <p class="mt-2 text-3xl font-semibold text-primary" x-text="summary.pending"></p>
        </div>
        <div class="rounded-3xl border border-base-300 bg-base-100 p-5 shadow-sm">
          <p class="text-sm text-base-content/60">下書き</p>
          <p class="mt-2 text-3xl font-semibold text-warning" x-text="summary.draft"></p>
        </div>
        <div class="rounded-3xl border border-base-300 bg-base-100 p-5 shadow-sm">
          <p class="text-sm text-base-content/60">完了</p>
          <p class="mt-2 text-3xl font-semibold text-success" x-text="summary.done"></p>
        </div>
        <div class="rounded-3xl border border-base-300 bg-base-100 p-5 shadow-sm">
          <p class="text-sm text-base-content/60">合計</p>
          <p class="mt-2 text-3xl font-semibold" x-text="summary.total"></p>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
{{end}}
