{{define "setting.html"}}
<!DOCTYPE html>
{{template "html"}}
<head>{{template "head" dict "Title" "設定 - Growlink" "PageScript" "/static/js/pages/setting.js"}}</head>
<body class="bg-base-200 font-sans antialiased" x-data="settingPage" x-cloak>
<script type="application/json" id="profile-json">{{.ProfileJSON}}</script>
<div class="flex h-screen overflow-hidden">
  {{template "sidebar" .}}
  <div class="flex min-w-0 flex-1 min-h-0 flex-col">
    {{template "header" dict "Breadcrumb" "設定" "UserName" .UserName}}
    <main class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6 max-w-xl">
      <h1 class="font-display text-2xl font-semibold">個人設定</h1>
      <div class="mt-6 rounded-3xl border border-base-300 bg-base-100 p-6 shadow-sm space-y-4">
        <h2 class="font-semibold">基本情報</h2>
        <label class="form-control"><span class="label-text">氏名</span><input class="input input-bordered" x-model="form.name" /></label>
        <label class="form-control"><span class="label-text">メール</span><input class="input input-bordered" x-model="form.email" /></label>
        <button type="button" class="btn btn-primary" @click="saveProfile()">保存</button>
        <form class="pt-4 border-t border-base-300" action="/api/v1/setting/icon" method="post" enctype="multipart/form-data">
          <label class="form-control"><span class="label-text">アイコン</span><input type="file" name="icon" class="file-input file-input-bordered" accept="image/*" /></label>
          <button type="submit" class="btn btn-outline btn-sm mt-2">アップロード</button>
        </form>
        <button type="button" class="btn btn-ghost btn-sm" @click="deleteIcon()">アイコン削除</button>
      </div>
      <div class="mt-6 rounded-3xl border border-base-300 bg-base-100 p-6 shadow-sm">
        <h2 class="font-semibold">通知</h2>
        <label class="label cursor-pointer justify-start gap-3 mt-2">
          <input type="checkbox" class="toggle toggle-primary" x-model="form.remindEnabled" />
          <span class="label-text">トピック未提出のリマインドを受け取る</span>
        </label>
        <p class="text-xs text-base-content/50 mt-2">送信処理はバックエンドのジョブで実行されます（設定の保存のみ）</p>
        <button type="button" class="btn btn-outline btn-sm mt-4" @click="saveProfile()">通知設定を保存</button>
      </div>
    </main>
  </div>
</div>
</body>
</html>
{{end}}
