services:
  web:
    container_name: "growlink-web"
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - .:/app
    working_dir: /app
    command: ["sh", "-c", "cd frontend && bun install && bun run dev:docker"]

  app:
    container_name: "growlink"
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: .
    ports:
      - "${PORT}:1323"
    volumes:
      - .:/app                  # ローカル↔コンテナのファイル同期
      - go_modules:/go/pkg/mod  # Go モジュールキャッシュを永続化
    env_file:
      - .env
    working_dir: /app
    depends_on:
      - postgresql
      - dynamodb
    command: ["air"]

  postgresql:
    container_name: "growlink-db"
    build:
      context: .
      dockerfile: docker/database/postgresql/Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${PSQL_DB_NAME:-growlinkdb}
      POSTGRES_USER: ${PSQL_USER:-postgres}
      POSTGRES_PASSWORD: ${PSQL_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql

  dynamodb:
    container_name: "growlink-dynamodb"
    build:
      context: .
      dockerfile: docker/database/dynamodb/Dockerfile
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

volumes:
  go_modules:
    name: growlink-app-volume
  postgres_data:
    name: growlink-postgresql-volume
  dynamodb_data:
    name: growlink-dynamodb-volume
