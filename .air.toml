# macOS 開発用（既定）。Windows では .air.toml.win を .air.toml にコピーして利用。
[misc]
  # 終了時に一時ファイルを削除
  clean_on_exit = true

[build]
  root = "."
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_dir=[]
  include_file = ["./.env", "./.air.toml", "./cmd/app/main.go", "templates/pages/login.html", "templates/pages/logout.html"]
  exclude_dir = ["frontend", "static/app", "static/vendor", "node_modules"]
  # Goのビルド
  cmd = "go build -o ./tmp/main cmd/app/main.go"
  kill_delay = 0
  poll = true
  poll_interval = 500
  return = false
  return_delay = 0
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"